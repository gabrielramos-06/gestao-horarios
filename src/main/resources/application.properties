spring.application.name=gestao-horarios
server.port=8080

# Persistencia ORM em arquivo local (dados permanecem salvos ao fechar a aplicacao)
spring.datasource.url=jdbc:h2:file:./data/horarios_db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracoes do Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console do Banco H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuracoes do Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs